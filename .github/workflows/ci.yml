name: CI

on:
  pull_request:
    branches: [dev, main]
  push:
    branches: [dev, main]

# A new push to the same PR cancels the run that's still going.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  changes:
    runs-on: ubuntu-latest
    outputs:
      frontend: ${{ steps.diff.outputs.frontend }}
      backend: ${{ steps.diff.outputs.backend }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: diff
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            files=$(git diff --name-only "${{ github.event.pull_request.base.sha }}" HEAD)
          else
            files=$(printf 'haas-app/\nbackend/\nmongodb/')   # pushes to dev/main: check everything (one folder per line)
          fi
          # Changes to CI or to the Docker files count as touching everything.
          has() { echo "$files" | grep -qE "^($1|\.github/|Dockerfile|docker-compose\.yml|\.dockerignore)" && echo true || echo false; }
          echo "frontend=$(has haas-app/)" >> "$GITHUB_OUTPUT"
          echo "backend=$(has 'backend/|mongodb/|pytest\.ini')" >> "$GITHUB_OUTPUT"

  frontend:
    needs: changes
    if: needs.changes.outputs.frontend == 'true'
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: haas-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: haas-app/.nvmrc
          cache: npm
          cache-dependency-path: haas-app/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build      # tsc -b also enforces the @ts-expect-error checks in api.test.ts
      - run: npm test

  # Runs from the repo root: the routes import `mongodb` as a top-level package.
  # With no TEST_MONGO_URI set, conftest.py uses an in-memory mongomock database.
  backend:
    needs: changes
    if: needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: backend/requirements*.txt
      - run: pip install -r backend/requirements-dev.txt
      - run: pytest

  # The whole app as it will be deployed: builds the production image and starts it with Docker Compose
  # (built frontend + Flask + a throwaway MongoDB), then checks it over HTTP. Runs when either side changes,
  # since a change on one side can break the other.
  docker:
    needs: changes
    if: needs.changes.outputs.frontend == 'true' || needs.changes.outputs.backend == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Build the image and start the app
        run: docker compose up --build --detach --wait --wait-timeout 300
      - name: The frontend page is served
        run: curl -sf http://localhost:8000/ | grep -q '<div id="root">'
      - name: The API answers and reaches the database
        run: curl -sf http://localhost:8000/get_all_hw_names
      - name: A new user can register and log in
        run: |
          body='{"userID": "ciuser01", "password": "password123"}'
          curl -sf -X POST http://localhost:8000/add_user -H 'Content-Type: application/json' -d "$body"
          curl -sf -X POST http://localhost:8000/login -H 'Content-Type: application/json' -d "$body"
      - name: Container logs
        if: failure()
        run: docker compose logs
      - name: Stop and delete everything
        if: always()
        run: docker compose down --volumes

  ci-ok:
    if: always()
    needs: [changes, frontend, backend, docker]
    runs-on: ubuntu-latest
    steps:
      - run: |
          if [ "${{ contains(needs.*.result, 'failure') || contains(needs.*.result, 'cancelled') }}" = "true" ]; then
            echo "A required job failed."; exit 1
          fi
