# Keeps the Render free-tier web service awake. Render spins a free service down after about
# 15 minutes with no incoming requests, and the next visitor then waits 30-60 s for it to start,
# so this requests /health every 10 minutes to count as traffic.
#
# GitHub only runs scheduled workflows from the default branch (dev), so this starts working once
# it is merged there. GitHub can delay or skip scheduled runs when it is busy, and it turns them off
# after 60 days with no activity in the repo (turn it back on from the Actions tab).
#
# One always-on free service uses most of Render's 750 free instance-hours a month (about 730 h in a
# 31-day month), so don't keep a second free Render service awake on the same account.
name: Keep Render awake

on:
  schedule:
    - cron: '*/10 * * * *'   # 10 minutes leaves room for GitHub's delays under the 15-minute limit
  workflow_dispatch:

# The app's address. A repository variable named RENDER_URL overrides it without editing this file.
env:
  RENDER_URL: ${{ vars.RENDER_URL || 'https://hwaas-31b6.onrender.com' }}

# It only makes an HTTP request, so it needs no access to the repo.
permissions: {}

# If a run is still waiting on a cold start, the next one doesn't start a second request alongside it.
concurrency:
  group: keep-awake
  cancel-in-progress: false

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      # /health answers 200 once Flask has reached MongoDB, 503 if it can't. A cold start can take up
      # to a minute, so each try gets 90 s, and two retries cover a slow start or a single blip.
      # Worst case is 3 tries x 90 s + 2 x 10 s waits = 290 s, inside the job's time limit.
      - name: Request /health
        run: >-
          curl --silent --show-error --location --fail-with-body
          --max-time 90 --retry 2 --retry-all-errors --retry-delay 10
          --write-out '\nHTTP %{http_code} in %{time_total}s\n'
          "$RENDER_URL/health"
