# Local dev default. Override with an environment variable in production
# (Render/Railway/Heroku all support setting SPRING_DATA_MONGODB_URI directly).
spring.data.mongodb.uri=${SPRING_DATA_MONGODB_URI:mongodb://localhost:27017/haas}

server.port=${PORT:8081}

# So the React dev server (usually localhost:3000) can call this API directly.
# Tighten this to the real deployed frontend origin once we're on the cloud (R2-3).
cors.allowed-origins=${CORS_ALLOWED_ORIGINS:http://localhost:3000}
